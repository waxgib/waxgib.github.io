<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Pitchfake</title>
        <link rel="stylesheet" href="https://pyscript.net/releases/2026.3.1/core.css" />
        <script type="module" src="https://pyscript.net/releases/2026.3.1/core.js"></script>
    </head>
    <body>
        Album:<input type="text" id="tit" placeholder="Album name?" />
        <p/>
        By:<input type="text" id="art" placeholder="Who is it by?" />
        <p/>
        Year:<input type="text" id="yea" placeholder="1975?" />
        <p/>
        Score:<input type="text" id="pts" placeholder="Point score?" />
        <p/>
        Image url:<input type="text" id="url" size="90" placeholder="image url eg wikimedia" />
        <p/>
        Site:<input type="text" id="web" placeholder="Web site?" />
        <p/>
        Site:<input type="text" id="typ" placeholder="Albums/Singles?" />
        <p/>
        <button id="butmake">Make</button>
        <div id="dest">Loading...</div>
        <script type="py" config='{"packages": ["Pillow"]
        , "files": {"https://waxgib.github.io/TiemposHeadline-Medium.otf": "./Medium.otf"
        , "https://waxgib.github.io/TiemposHeadline-Regular.otf": "./Regular.otf"
        , "https://waxgib.github.io/TiemposHeadline-Light.otf": "./Light.otf"
        , "https://waxgib.github.io/TiemposHeadline-BoldItalic.otf": "./BoldItalic.otf"} }'>
            from pyscript import HTML, display
            from pyscript.fetch import fetch
            from pyscript import when, web
            import base64
            from js import document
            from PIL import Image, ImageDraw, ImageFont
            import io
            from random import randint

            aslweb = ['Pitchforks', 'Pitchfake', 'Pitchfraud', 'Pitching']
            print(len(aslweb))
            asra = randint(0, len(aslweb)-1)
            asweb = aslweb[asra]

            astyp = 'ALBUMS'

            aslla = [['https://upload.wikimedia.org/wikipedia/en/9/93/Low_(album).jpg'
            , "Low", "David Bowie", "1977", "3.1"]
            , ['https://upload.wikimedia.org/wikipedia/commons/d/d1/Pet_Sounds_%28color_corrected%29.jpg'
            , "Pet Sounds", "The Beach Boys", "1966", "1.3"]
            , ['https://upload.wikimedia.org/wikipedia/en/7/70/The_Ghost_in_Daylight.png'
            , "The Ghost In Daylight", "Gravenhurst", "2012", "9.7"]
            , ['https://upload.wikimedia.org/wikipedia/en/d/d1/Sumday.jpg'
            , "Sumday", "Grandaddy", "2003", "9.9"]
            , ['https://upload.wikimedia.org/wikipedia/en/d/d1/Sumday.jpg'
            , "Sumday", "Grandaddy", "2003", "9.9"]
            , ['https://upload.wikimedia.org/wikipedia/en/3/3b/Green_Lanes_album_cover.jpg'
            , "Green Lanes", "Ultimate Painting", "2015", "9.1"]
            ]
            asra = randint(0, len(aslla)-1)
            asla = aslla[asra]
            #if asra == 0:
            #    asla = ['https://upload.wikimedia.org/wikipedia/en/9/93/Low_(album).jpg', "Low", "David Bowie", "1977", "3.1"]
            #elif asra == 1:
            #    asla = ['https://upload.wikimedia.org/wikipedia/commons/d/d1/Pet_Sounds_%28color_corrected%29.jpg', "Pet Sounds", "The Beach Boys", "1966", "1.3"]
            #else:
            #    asla = ['https://upload.wikimedia.org/wikipedia/en/7/70/The_Ghost_in_Daylight.png', "The Ghost In Daylight", "Gravenhurst", "2012", "9.9"]

            asurl = asla[0]
            astit = asla[1]
            asart = asla[2]
            asyea = asla[3]
            aspts = asla[4]
            print('intro', asweb, astit, asart, asyea, aspts)

            qwtit = web.page["tit"]
            qwtit.value = astit
            qwart = web.page["art"]
            qwart.value = asart
            qwyea = web.page["yea"]
            qwyea.value = asyea
            qwpts = web.page["pts"]
            qwpts.value = aspts
            qwweb = web.page["web"]
            qwweb.value = asweb
            qwtyp = web.page["typ"]
            qwtyp.value = astyp
            qwurl = web.page["url"]
            qwurl.value = asurl
            print('qwtit type', type(qwtit))

            #asres = await fetch(asurl)
            #print(asres.status, asres.ok, asres.statusText)
            #asdat = await asres.bytes()
            #print(type(asdat))
            #asby = asdat.to_bytes()
            #print(type(asby))

            async def defmake():
                qwurl = web.page["url"]
                asurl = qwurl.value.strip()
                qwtit = web.page["tit"]
                astit = qwtit.value.strip()
                qwart = web.page["art"]
                asart = qwart.value.strip()
                qwyea = web.page["yea"]
                asyea = qwyea.value.strip()
                qwpts = web.page["pts"]
                aspts = qwpts.value.strip()
                qwweb = web.page["web"]
                asweb = qwweb.value.strip()
                qwtyp = web.page["typ"]
                astyp = qwtyp.value.strip()
                print('defmake', asweb, astit, asart, asyea, aspts, asurl)

                asres = await fetch(asurl)
                print(asres.status, asres.ok, asres.statusText)
                asdat = await asres.bytes()
                print(type(asdat))
                asby = asdat.to_bytes()
                print(type(asby))

                display(asby, target="dest", append=False)

                #data = base64.b64encode(asby).decode("utf-8")
                #asimgsrc = f"data:image/jpg;base64,{data}"
                #print(type(data))
                #print(type(asimgsrc))
                #display(asimgsrc, target="dest", append=False)
                #document.querySelector("img").setAttribute("src", asimgsrc)

                asimap = Image.open(io.BytesIO(asby))
                #asdrap = ImageDraw.Draw(asimap)

                asdxj = 400
                asdyj = 400
                asimi = asimap.resize((asdxj, asdyj), Image.Resampling.LANCZOS)
                asdxi, asdyi = asimi.size

                ascolwhi = (248, 248, 248)
                ascolbla = (0, 0, 0)
                ascolgry = (192, 192, 192)
                asdxg = 800
                asdyg = 1200
                asimg = Image.new('RGB', (asdxg, asdyg), ascolwhi)
                asdrg = ImageDraw.Draw(asimg)

                asfo0 = ImageFont.truetype("./Regular.otf", 48)
                asfo1 = ImageFont.truetype("./Light.otf", 20)
                asfo2 = ImageFont.truetype("./BoldItalic.otf", 52)
                asfo3 = ImageFont.truetype("./Light.otf", 44)
                asfo4 = ImageFont.truetype("./Light.otf", 20)
                asfo5 = ImageFont.truetype("./Medium.otf", 96)

                asdrg.rectangle((0, 0, asdxg, 100), fill = ascolbla)
                asdrg.rectangle((40, 40, 70, 41), fill = ascolgry)
                asdrg.rectangle((40, 50, 70, 51), fill = ascolgry)
                asdrg.rectangle((40, 60, 70, 61), fill = ascolgry)

                astex = asweb
                asdxt = asdrg.textlength(astex, asfo0)
                asx = 105
                asy = 30
                asdrg.text((asx, asy), astex, ascolwhi, stroke_width=1.5, font = asfo0)

                astex = astyp
                asdxt = asdrg.textlength(astex, asfo1)
                asx = int(asdxg/2 - asdxt/2)
                asy = 200
                asdrg.text((asx, asy), astex, ascolbla, font = asfo1)

                astex = astit
                asdxt = asdrg.textlength(astex, asfo2)
                asx = int(asdxg/2 - asdxt/2)
                asy += 60
                asdrg.text((asx, asy), astex, ascolbla, font = asfo2)

                astex = asart
                asdxt = asdrg.textlength(astex, asfo3)
                asx = int(asdxg/2 - asdxt/2)
                asy += 100
                asdrg.text((asx, asy), astex, ascolbla, font = asfo3)
                asdrg.line((asx, asy+38, asx+asdxt, asy+38), fill=ascolbla)

                astex = asyea
                asdxt = asdrg.textlength(astex, asfo4)
                asx = int(asdxg/2 - asdxt/2)
                asy += 100
                asdrg.text((asx, asy), astex, ascolbla, font = asfo4)

                asx = 60
                asy += 100
                asimg.paste(asimi, (asx, asy))
                print(asx, asy, asimi.size, asimg.size)

                asxf = 510
                asxt = 750
                asyf = asy + 80
                asyt = asyf + 240
                asdrg.ellipse((asxf, asyf, asxt, asyt), fill=ascolbla)
                asinn = 16
                asxf = asxf + asinn
                asxt = asxt - asinn
                asyf = asyf + asinn
                asyt = asyt - asinn
                asdrg.ellipse((asxf, asyf, asxt, asyt), fill=ascolwhi)

                astex = aspts
                asdxt = asdrg.textlength(astex, asfo5)
                asx = int(630 - asdxt/2)
                asy += 155
                asdrg.text((asx, asy), astex, ascolbla, font = asfo5)

                asdxo = 600
                asdyo = 900
                asimo = asimg.resize((asdxo, asdyo), Image.Resampling.LANCZOS)

                display(asimo, target="dest", append=False)

            @when("click", "#butmake")
            async def defbutmake(event):
                print('defbutmake butmake', astit, asart)
                await defmake()

            print('main', asweb, astit, asart, asyea, aspts)
            await defmake()

        </script>
    </body>
</html>
